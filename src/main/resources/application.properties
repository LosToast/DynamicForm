spring.application.name=DynamicForm

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/formbuilder
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.type.json_format_mapper=com.example.dynamicform.utils.JacksonJsonFormatMapper
